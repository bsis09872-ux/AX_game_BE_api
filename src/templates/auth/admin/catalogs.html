{% extends "auth/admin/layout.html" %}
{% block admin_title %}아이템 목록{% endblock %}
{% block admin_content %}
<section class="panel admin-section" aria-labelledby="catalog-title">
  <div class="admin-heading"><div><h2 id="catalog-title">아이템 도감 관리</h2><p>아이템 종류와 기본 속성을 관리합니다. 개별 소유/거래 기록은 보유 아이템 이력에서 확인하세요.</p></div><a class="btn" href="/admin/catalogs/new">+ 아이템 만들기</a></div>
  <form id="catalog-filters" class="admin-filters">
    <label>분류<select name="category"><option value="">전체</option><option>FISH</option><option>GEM</option><option>MISC</option></select></label>
    <label>희귀도<select name="rarity"><option value="">전체</option>{% for value in ['COMMON','UNCOMMON','RARE','EPIC','LEGENDARY'] %}<option>{{ value }}</option>{% endfor %}</select></label>
    <label>정렬<select name="sort"><option value="rarity_desc">희귀도순</option><option value="name_asc">이름순</option></select></label>
    <button class="btn wood">조회</button><a id="csv-link" download class="admin-export" href="/admin/item-catalogs/export.csv">현재 페이지 CSV ↓</a>
  </form>
  <div class="admin-table-scroll"><table><thead><tr><th>아이템</th><th>분류</th><th>희귀도</th><th>거래시작가</th><th>낚시 / 가중치</th><th>관리</th></tr></thead><tbody id="catalog-rows"></tbody></table></div>
  <div class="admin-pagination"><button id="catalog-prev" class="btn wood" type="button">이전</button><span id="catalog-page"></span><button id="catalog-next" class="btn wood" type="button">다음</button></div>
</section>
{% endblock %}
